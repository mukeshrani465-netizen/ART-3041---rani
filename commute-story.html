<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ART 3041 — Commute Story</title>
<style>
  :root {
    --ink: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e2e0db;
    --bg: #faf9f6;
    --accent: #C9788D; /* pink to match the homepage */
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 720px;
    margin: 0 auto;
    padding: 64px 24px 32px;
  }
  header h1 {
    font-size: 2.2rem;
    margin: 0 0 8px;
  }
  header p {
    color: var(--muted);
    margin: 0;
    font-size: 1rem;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 96px;
  }
  .card {
    border-top: 1px solid var(--line);
    padding: 40px 0;
  }
  .card:first-of-type {
    border-top: 1px solid var(--line);
  }
  .card img {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
    margin-bottom: 20px;
  }
  .card-num {
    font-size: 0.85rem;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  .card h2 {
    font-size: 1.1rem;
    margin: 4px 0 12px;
  }
  .prompt {
    font-size: 0.95rem;
    color: var(--ink);
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 14px 16px;
    margin: 0 0 10px;
  }
  footer {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 24px 64px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  footer a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>Commute Story</h1>
  <p>ART 3041 &middot; my commute, reimagined three ways</p>
</header>

<main>

  <div class="card">
    <span class="card-num">01</span>
    <h2>The overpass garden</h2>
    <img src="commute1.jpg" alt="An elevated train overpass wrapped in ironwork, vines and flower boxes, with vintage race cars parked in the street below">
    <!-- To add the prompt you used, paste it here: <p class="prompt">your prompt</p> -->
  </div>

  <div class="card">
    <span class="card-num">02</span>
    <h2>Subway seats at the seaside</h2>
    <img src="commute2.jpg" alt="Orange subway seats set at the edge of clear turquoise water in front of a colorful Italian seaside town, with a small spiny creature resting on one seat">
    <!-- To add the prompt you used, paste it here: <p class="prompt">your prompt</p> -->
  </div>

  <div class="card">
    <span class="card-num">03</span>
    <h2>Zombies on the platform</h2>
    <img src="commute3.jpg" alt="A subway platform where zombie faces stare out through the windows of a silver train car as riders wait on the yellow edge strip">
    <!-- To add the prompt you used, paste it here: <p class="prompt">your prompt</p> -->
  </div>

</main>

<footer>
  <a href="index.html">&larr; back to homepage</a>
</footer>

</body>
</html>
